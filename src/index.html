<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Camera Kit Template</title>
    <meta name="description" content="Camera Kit Template" />
    <meta name="robots" content="noindex" />
    <script defer src="https://umami-mxp.up.railway.app/script.js" data-website-id="09f2b2e9-229d-4b77-897e-b2d5915e0b1e"></script>
    <!-- Force HTTPS redirect for GitHub Pages -->
    <script>
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        location.replace('https:' + window.location.href.substring(window.location.protocol.length));
      }
    </script>
  </head>

  <body>
    <canvas id="canvas"></canvas>
    <canvas id="capture-canvas"></canvas>
    <div id="switch-cam">
      <button id="switch-button" class="button-class"></button>
    </div>
    <div class="poweredbysnap-logo" style="display: none;">
      <img id="image" src="./assets/Powered_bysnap.png" alt="Powered by Snap" />
    </div>
    <div id="controls">
      <img id="outline" src="./assets/RecordOutline.png" />
      <button id="record-button" class="button-class"></button>
    </div>

    <div id="action-buttons" style="display: none">
      <div class="button-row">
        <button id="download-button" class="button-class">DOWNLOAD</button>
        <button id="share-button" class="button-class">SHARE</button>
      </div>
      <div class="retry-row">
        <button id="back-button" class="button-class"> <u>Retry</u></button>
      </div>
    </div>

    <!-- Removed back-button-container, Retry is now below action buttons -->

    <div id="loading">
      <img id="loading-icon" src="./assets/LoadingIcon.png" alt="loading" />
    </div>
  </body>
</html>
